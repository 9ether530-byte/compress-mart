# Compress-Mart target matrix — Phase 1: static, emulated profiles.
# A real profiler would query /sys, /proc and vendor SDKs on the device.
# Here every HCP is marked emulated=true so no benchmark is ever mistaken
# for a measurement on physical hardware.
targets:
  - id: apple-m2
    category: laptop
    cpu: Apple M2
    isa_flags: [arm64, neon]
    npu_available: true
    memory_mb: 16384
    memory_bandwidth_gbs: 100
    recommended_bit_widths: [8, 16]
    latency_ceiling_ms_p95: 120
    min_quality_delta: -0.05
  - id: intel-i7-13th
    category: laptop
    cpu: Intel Core i7 13th gen
    isa_flags: [x86_64, avx2, avx512]
    npu_available: false
    memory_mb: 32768
