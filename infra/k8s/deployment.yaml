apiVersion: apps/v1
kind: Deployment
metadata:
  name: compress-mart-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: compress-mart-api}
  template:
    metadata:
      labels: {app: compress-mart-api}
    spec:
      containers:
        - name: api
          # Phase 9: build this tag first with scripts/build-container-phase8.sh.
          # Earlier phases tagged phase5 (slim) and phase6-torch only;
          # phase7 was never built, so it must not be referenced here.
          image: compress-mart:phase8
          ports: [{containerPort: 8000}]
          env:
            - {name: COMPRESS_MART_DATA, value: /data}
            - {name: COMPRESS_MART_SEARCH_URL, value: "http://compress-mart-search:7700"}
            - {name: COMPRESS_MART_PG_DSN, valueFrom: {secretKeyRef: {name: compress-mart-secrets, key: pg-dsn}}}
            - {name: COMPRESS_MART_S3_ENDPOINT, value: "http://compress-mart-minio:9000"}
            - {name: COMPRESS_MART_S3_BUCKET, value: compress-mart}
            - {name: COMPRESS_MART_S3_ACCESS_KEY, value: compress_mart}
            - {name: COMPRESS_MART_S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: compress-mart-secrets, key: s3-secret-key}}}
            # Secrets come from the compress-mart-secrets Secret, never
            # from literals in this manifest. Create it out of band,
            # e.g. kubectl create secret generic compress-mart-secrets
            # --from-literal=pg-dsn='host=... password=...' \
            # --from-literal=s3-secret-key='...' \
            # --from-literal=pg-password='...' — and never commit it.
            # COMPRESS_MART_API_TOKEN: set from a Secret in a real
            # deployment; when unset, auth stays off (local dev only).
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: compress-mart-api
spec:
  selector: {app: compress-mart-api}
  ports:
    - {port: 8000, targetPort: 8000}
  type: ClusterIP
---
# Meilisearch sidecar service: proven live in Podman in Phase 7
# (getmeili/meilisearch:v1.17.1, host port 7700, MEILI_NO_ANALYTICS).
# This manifest is NOT cluster-proven: no kubectl/kind is available
# in this sandbox, so it is YAML-validated only, not applied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compress-mart-search
spec:
  replicas: 1
  selector:
    matchLabels: {app: compress-mart-search}
  template:
    metadata:
      labels: {app: compress-mart-search}
    spec:
      containers:
        - name: search
          image: docker.io/getmeili/meilisearch:v1.17.1
          ports: [{containerPort: 7700}]
          env:
            - {name: MEILI_NO_ANALYTICS, value: "true"}
          volumeMounts:
            - {name: search-data, mountPath: /meili_data}
      volumes:
        - name: search-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: compress-mart-search
spec:
  selector: {app: compress-mart-search}
  ports:
    - {port: 7700, targetPort: 7700}
  type: ClusterIP
---
# Postgres replica (Phase 8): the API syncs to it on demand via
# POST /postgres/sync. SQLite stays the authoritative primary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compress-mart-postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: compress-mart-postgres}
  template:
    metadata:
      labels: {app: compress-mart-postgres}
    spec:
      containers:
        - name: postgres
          image: docker.io/pgvector/pgvector:pg16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: compress_mart}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: compress-mart-secrets, key: pg-password}}}
            - {name: POSTGRES_DB, value: compress_mart}
          volumeMounts:
            - {name: pg-data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: pg-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: compress-mart-postgres
spec:
  selector: {app: compress-mart-postgres}
  ports:
    - {port: 5432, targetPort: 5432}
  type: ClusterIP
