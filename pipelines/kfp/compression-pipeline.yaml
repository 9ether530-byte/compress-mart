# Kubeflow Pipelines definition — Phase 9: declarative, not executed by KFP.
# The local API runs the same stage order in-process (see app.py). When KFP
# is available, each stage maps to the container image named here.
# DAG fix (Phase 9): `distill` is optional (policy == auto only), so
# `prune` depends on `profile`, not on `distill` — previously a skipped
# distill skipped prune and the entire downstream chain.
# All stages run the single built image compress-mart:phase8
# (scripts/build-container-phase8.sh); the per-stage phase1 images
# named in earlier phases were never built.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: compression-pipeline
  annotations:
    compress-mart/phase: "9-audit-fixes-not-kfp-executed"
spec:
  entrypoint: compress
  arguments:
    parameters:
      - {name: model_id}
      - {name: target, value: raspberry-pi-5}
      - {name: policy, value: auto}
  templates:
    - name: compress
      dag:
        tasks:
          - {name: ingest, template: ingest}
          - {name: profile, template: profile, dependencies: [ingest]}
          - {name: distill, template: distill, dependencies: [profile], when: "{{workflow.parameters.policy}} == auto"}
          - {name: prune, template: prune, dependencies: [profile]}
          - {name: quantize, template: quantize, dependencies: [prune]}
          - {name: export, template: export, dependencies: [quantize]}
          - {name: benchmark, template: benchmark, dependencies: [export]}
          - {name: certify, template: certify, dependencies: [benchmark]}
    - name: ingest
      container: {image: "compress-mart:phase8"}
    - name: profile
      container: {image: "compress-mart:phase8"}
    - name: distill
      container: {image: "compress-mart:phase8"}
    - name: prune
      container: {image: "compress-mart:phase8"}
    - name: quantize
      container: {image: "compress-mart:phase8"}
    - name: export
      container: {image: "compress-mart:phase8"}
    - name: benchmark
      container: {image: "compress-mart:phase8"}
    - name: certify
      container: {image: "compress-mart:phase8"}
